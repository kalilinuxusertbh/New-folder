<!DOCTYPE html>
<html lang="sv" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logga in – Google Konton</title>
    <style>
        :root {
            --google-blue: #0b57d0;
            --google-hover: #0842a0;
            --text-main: #1f1f1f;
            --text-sub: #444746;
            --border-color: #747775;
            --bg-color: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Google Sans", "Roboto", arial, sans-serif;
            background-color: #f0f2f1;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1040px;
            min-height: 480px;
            background: var(--bg-color);
            border-radius: 28px;
            padding: 36px;
            gap: 48px;
            box-shadow: none;
        }

        /* Side-by-side Layout (V3 Design) */
        .left-col { 
            flex: 1; 
            padding-top: 8px; 
            display: flex;
            flex-direction: column;
        }
        .right-col { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }

        .logo { margin-bottom: 16px; }
        .logo svg { width: 48px; height: 48px; }

        h1 { 
            font-size: 36px; 
            font-weight: 400; 
            line-height: 44px; 
            margin-bottom: 16px; 
            color: var(--text-main);
        }
        .subtitle { 
            font-size: 16px; 
            line-height: 24px; 
            color: var(--text-main);
            margin-bottom: 8px;
        }

        /* Form Styling */
        .input-group { margin-top: 24px; position: relative; }
        
        input {
            width: 100%;
            padding: 13px 15px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            outline: none;
            color: var(--text-main);
            background: transparent;
        }

        input:focus { border: 2px solid var(--google-blue); padding: 12px 14px; }

        .link-text {
            color: var(--google-blue);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: inline-block;
            margin-top: 9px;
            cursor: pointer;
        }
        .link-text:hover { text-decoration: underline; }

        .guest-text {
            font-size: 14px;
            line-height: 20px;
            color: var(--text-sub);
            margin: 32px 0;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-top: 40px;
        }

        .btn-next {
            background-color: var(--google-blue);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .btn-next:hover { 
            background-color: var(--google-hover); 
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.302), 0 1px 3px 1px rgba(60,64,67,0.149);
        }

        .btn-secondary {
            background: transparent;
            color: var(--google-blue);
            border: none;
            padding: 10px 12px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-secondary:hover { background: rgba(11, 87, 208, 0.04); }

        /* Step 2 specific styles */
        #password-step { display: none; }
        .user-pill {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px 4px 6px;
            border: 1px solid #dadce0;
            border-radius: 16px;
            font-size: 14px;
            margin-bottom: 24px;
            cursor: pointer;
            color: var(--text-main);
        }
        .user-pill:hover { background: #f8f9fa; }

        /* Responsive */
        @media (max-width: 850px) {
            body { background-color: #fff; }
            .container { 
                flex-direction: column; 
                padding: 24px; 
                align-items: flex-start; 
                text-align: left; 
                max-width: 450px; 
                min-height: auto;
            }
